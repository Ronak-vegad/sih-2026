services:
  - type: web
    name: bis-chatbot-backend
    env: python
    region: singapore          # closest region to India
    plan: free
    autoDeploy: true

    # The vector index (data/chroma_db/) and QCO database (data/qco_structured.db)
    # are committed to the repo and ship with the deployment.
    # Re-indexing is NOT run here because Render free plan has no persistent disk
    # (any files written during build are wiped on the next restart).
    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health

    envVars:
      - key: GROQ_API_KEY
        sync: false               # set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false               # set manually in Render dashboard
      - key: NVIDIA_API_KEY
        sync: false               # optional — only needed for NVIDIA NIM
      - key: EMBED_PROVIDER
        value: gemini             # use Gemini for embeddings on Render
      - key: ALLOW_ORIGIN
        sync: false               # set to your Vercel frontend URL, e.g. https://bis-rag.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.9"
