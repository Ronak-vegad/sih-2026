name: BIS-RAG CI — Lint + Eval Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff
        run: ruff check backend/ eval/ --ignore E501,E402

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found (add tests/ directory)"

  eval-gate:
    name: Eval Gate
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only run eval gate on pushes to main (not every PR — it's slow)
    if: github.ref == 'refs/heads/main'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      EMBED_PROVIDER: gemini

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore ChromaDB cache
        uses: actions/cache@v4
        with:
          path: data/chroma_db
          key: chroma-db-${{ hashFiles('data/raw_documents.json') }}
          restore-keys: |
            chroma-db-

      - name: Build index if missing
        run: |
          python -c "
          from pathlib import Path
          import chromadb
          from backend.config import CHROMA_DIR
          c = chromadb.PersistentClient(str(CHROMA_DIR))
          cols = c.list_collections()
          if not cols:
              print('No index found — building...')
              import subprocess
              subprocess.run(['python', '-m', 'backend.ingest'], check=True)
          else:
              print(f'Index found: {cols[0].name}')
          "

      - name: Start backend
        run: |
          nohup python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 8
          curl --fail http://127.0.0.1:8000/health | python -m json.tool

      - name: Run eval gate (CI mode)
        run: |
          python eval/run_eval.py --ci --base-url http://127.0.0.1:8000 --tag ci-${{ github.sha }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: eval/results/
          retention-days: 30
